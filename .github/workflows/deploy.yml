name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # 保留历史构建的静态资源，避免缓存的旧 HTML 引用已删除的 chunk 而报错
      - uses: actions/cache@v6
        with:
          path: .asset-cache
          key: next-static-${{ github.run_id }}
          restore-keys: next-static-

      - name: Merge previous static assets
        run: |
          if [ -d .asset-cache/_next/static ]; then
            cp -rn .asset-cache/_next/static/. out/_next/static/
          fi
          mkdir -p .asset-cache/_next/static
          cp -r out/_next/static/. .asset-cache/_next/static/
          find .asset-cache -type f -mtime +30 -delete

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
